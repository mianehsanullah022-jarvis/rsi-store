<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Shop massage guns, trimmers and trending gadgets online in Pakistan. Cash on Delivery all over Pakistan. RSI Accessories.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="RSI Accessories">
<meta property="og:description" content="Massagers, trimmers and trending gadgets. Cash on Delivery all over Pakistan.">
<meta property="og:image" content="https://mianehsanullah022-jarvis.github.io/rsi-store/img/massage-gun-1.webp">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://hmxfiyzinxihanckmuil.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="img/massage-gun-1.webp" fetchpriority="high">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Saira:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--ink:#14161a;--steel:#5b6270;--line:#e2e4e8;--paper:#f2f3f5;--white:#fff;
  --red:#e11d2e;--red-dark:#b8121f;--ok:#0f8a4b;
  --display:"Saira",system-ui,sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;--wrap:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.55 var(--body);color:var(--ink);background:var(--paper)}
img{max-width:100%;display:block}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top */
.announce{background:var(--red);color:#fff;font-size:13.5px;font-weight:600;text-align:center;padding:7px 16px}
.announce:empty{display:none}
header{background:var(--black);color:#fff;position:sticky;top:0;z-index:30}
.hbar{display:flex;align-items:center;gap:16px;height:64px}
.brand img{height:40px;width:auto}
.hnav{display:flex;gap:4px;margin-left:auto;align-items:center}
.hnav a,.hnav button{background:none;border:0;color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:10px 12px;border-radius:8px;cursor:pointer}
.hnav a:hover,.hnav button:hover{background:#1c1c1c}
.cartbtn{display:flex;align-items:center;gap:8px}
.cartbtn .n{background:var(--red);min-width:22px;height:22px;border-radius:11px;font-size:12.5px;display:grid;place-items:center;padding:0 6px}
@media(max-width:560px){.hnav .hide-s{display:none}.brand img{height:34px}}

/* hero */
.hero{background:var(--white);border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:36px 16px 44px}
.hero-img{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--paper)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-txt .tag{display:inline-block;font-weight:700;font-size:13px;color:var(--red);margin-bottom:10px}
.pname{font:800 italic clamp(30px,4.6vw,52px)/1.02 var(--display);letter-spacing:-.01em;margin:0 0 14px}
.hero-txt p{color:var(--steel);margin:0 0 22px;max-width:46ch}
.stripe{display:inline-block;position:relative;margin:0 0 24px 6px;padding:8px 22px 8px 18px;color:#fff;font:800 italic 30px/1 var(--display)}
.stripe::before{content:"";position:absolute;inset:0;background:var(--red);transform:skewX(-16deg);z-index:0}
.stripe span{position:relative}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:13px 22px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn:hover{background:#000}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:wait}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:20px;padding:16px 16px 28px}}

/* trust */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.trust div{background:var(--white);padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:14.5px}
.trust b{display:block;font-size:15px}
.trust small{color:var(--steel)}
.trust svg{flex:none;color:var(--red)}
@media(max-width:700px){.trust{grid-template-columns:1fr}.trust div{padding:10px 16px}}

/* shop */
.sec{padding:36px 0 48px}
.sec h2{font:800 italic 30px/1.1 var(--display);margin:0 0 6px}
.sec .sub{color:var(--steel);margin:0 0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--white);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.card .ph{aspect-ratio:1;background:var(--paper);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover .ph img{transform:scale(1.04)}
.badge{position:absolute;top:10px;left:10px;background:var(--black);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:5px}
.badge.out{background:var(--steel)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:15.5px;line-height:1.3;margin:0;font-weight:600}
.price{font-weight:700;color:var(--red);font-size:17px}
.price s{color:var(--steel);font-weight:500;font-size:14px;margin-left:6px}
.card .add{margin-top:auto;border:1.5px solid var(--ink);background:none;border-radius:7px;padding:9px;font-weight:700;cursor:pointer;font-size:14.5px}
.card .add:hover{background:var(--ink);color:#fff}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:var(--r);padding:40px;text-align:center;color:var(--steel)}
.skel{background:linear-gradient(90deg,#eceef1,#f6f7f8,#eceef1);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
@keyframes sk{to{background-position:-200% 0}}

/* product page */
.pp{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;padding:24px 0 48px}
.gal .main{border-radius:var(--r);overflow:hidden;background:var(--white);border:1px solid var(--line);aspect-ratio:1}
.gal .main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:10px}
.thumbs button{width:72px;height:72px;border:2px solid var(--line);border-radius:8px;overflow:hidden;padding:0;cursor:pointer;background:var(--white)}
.thumbs button[aria-pressed=true]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.crumb{font-size:14px;color:var(--steel);margin:18px 0 0}
.crumb a{text-decoration:none}
.pinfo .pname{font-size:clamp(28px,3.6vw,42px)}
.pinfo .price{font-size:26px;margin-bottom:6px}
.stock{font-size:14px;font-weight:600;margin-bottom:18px}
.stock.ok{color:var(--ok)}.stock.no{color:var(--steel)}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;background:var(--white);margin-bottom:12px}
.qty button{width:44px;height:46px;border:0;background:none;font-size:20px;cursor:pointer}
.qty output{width:40px;display:grid;place-items:center;font-weight:700}
.feat{list-style:none;padding:0;margin:22px 0;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat li::before{content:"";width:8px;height:8px;margin-top:8px;flex:none;background:var(--red);transform:skewX(-16deg)}
.desc{color:#363a42}
.pp .btns{flex-direction:column}
@media(max-width:820px){.pp{grid-template-columns:1fr;gap:18px;padding-top:12px}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--white);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:800 italic 24px var(--display)}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
.dbody{flex:1;overflow:auto;padding:8px 18px}
.dfoot{border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom))}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line img,.line .noimg{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--paper)}
.line .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.line .mini{display:flex;align-items:center;gap:6px;margin-top:6px}
.line .mini button{width:28px;height:28px;border:1px solid var(--line);background:var(--white);border-radius:6px;cursor:pointer}
.line .rm{border:0;background:none;color:var(--steel);text-decoration:underline;cursor:pointer;font-size:13px;margin-left:6px}
.row{display:flex;justify-content:space-between;margin:4px 0}
.row.big{font-weight:700;font-size:18px;margin-top:8px}
.muted{color:var(--steel);font-size:14px}

/* checkout */
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;padding:24px 0 56px;align-items:start}
.box{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.box h2{font:800 italic 24px var(--display);margin:0 0 14px}
.box h3{font-size:16px;margin:22px 0 10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:12px 13px;background:var(--white);font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:grid;gap:8px}
.pay label{margin:0;display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;font-weight:600}
.pay input{width:auto;accent-color:var(--red)}
.pay label:has(input:checked){border-color:var(--ink);background:#fafafa}
.payinfo{background:var(--paper);border-radius:8px;padding:12px 14px;margin-top:10px;font-size:14.5px}
.err{background:#fde8ea;color:var(--red-dark);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14.5px;margin-top:12px}
.err:empty{display:none}
@media(max-width:860px){.co{grid-template-columns:1fr}.co .sum{order:-1}}
@media(max-width:480px){.two{grid-template-columns:1fr}}

.done{max-width:560px;margin:40px auto 64px;text-align:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
.done h1{font:800 italic 34px var(--display);margin:0 0 8px}
.ordno{font:800 italic 40px var(--display);color:var(--red)}

.timeline{display:flex;justify-content:space-between;margin:18px 0;position:relative}
.timeline div{flex:1;text-align:center;font-size:13px;color:var(--steel);position:relative}
.timeline div::before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:var(--line);margin:0 auto 6px}
.timeline div.on{color:var(--ink);font-weight:700}
.timeline div.on::before{background:var(--red)}

footer{background:var(--black);color:#c9ccd2;padding:36px 0 calc(36px + env(safe-area-inset-bottom));font-size:14.5px}
.fgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px}
footer h4{color:#fff;margin:0 0 10px;font-size:15px}
footer a{color:#c9ccd2;text-decoration:none;display:block;padding:3px 0}
footer a:hover{color:#fff}
footer img{height:44px;width:auto;margin-bottom:10px}
.copy{border-top:1px solid #222;margin-top:26px;padding-top:16px;font-size:13px;color:#8a8f98}
@media(max-width:700px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}

.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;display:none;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20}
.wa.on{display:grid}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);visibility:hidden;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-weight:600;z-index:60;transition:transform .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
/* 1. hero reveal (plays once per visit) */
.hero.play .hero-img{animation:hImg .9s cubic-bezier(.2,.7,.2,1) both}
.hero.play .hero-img img{animation:hZoom 1.4s cubic-bezier(.2,.7,.2,1) both}
.hero.play .rv{animation:hUp .6s cubic-bezier(.2,.7,.2,1) both}
.hero.play .rv:nth-child(1){animation-delay:.15s}.hero.play .rv:nth-child(2){animation-delay:.25s}
.hero.play .rv:nth-child(3){animation-delay:.35s}.hero.play .rv:nth-child(4){animation-delay:.45s}
.hero.play .rv:nth-child(5){animation-delay:.55s}
@keyframes hImg{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes hZoom{from{transform:scale(1.12)}to{transform:none}}
@keyframes hUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-img{position:relative}
.hero-img .badge{top:14px;left:14px}

/* 2. word rotator */
.rot{display:inline-block;color:var(--ink);border-bottom:2px solid var(--red)}
.rot.sw{animation:rotIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rotIn{from{opacity:0;transform:translateY(60%)}to{opacity:1;transform:none}}

/* 3. price roll */
.stripe s{position:relative;font:600 16px var(--body);color:#ffd2d6;margin-left:10px;vertical-align:middle}
.roll{font-variant-numeric:tabular-nums}

/* 4. click success */
.add.ok,.btn.ok{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;animation:pop .35s}
@keyframes pop{40%{transform:scale(1.06)}}
.cartbtn .n.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.5)}60%{transform:scale(.9)}}

/* 5. sale pings */
.ping{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px 14px 8px 8px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-width:min(340px,calc(100% - 100px));font-size:13.5px;line-height:1.35;transform:translateY(140%);opacity:0;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s;text-decoration:none}
.ping.on{transform:none;opacity:1}
.ping img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--paper)}
.ping b{display:block;font-size:14px}
.ping small{color:var(--steel)}
.ping .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}

/* 6. review shuffle */
.revs{background:var(--white);border-top:1px solid var(--line);padding:36px 0 44px}
.revs h2{font:800 italic 30px/1.1 var(--display);margin:0 0 18px}
.rcard{background:var(--paper);border-radius:var(--r);padding:22px;max-width:640px;min-height:150px}
.rcard.sw{animation:rSw .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rSw{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.stars{color:#f5a400;font-size:18px;letter-spacing:2px}
.rcard p{margin:10px 0 12px;font-size:17px}
.rdots{display:flex;gap:6px;margin-top:14px}
.rdots button{width:10px;height:10px;border-radius:5px;border:0;background:var(--line);padding:0;cursor:pointer;transition:width .25s}
.rdots button[aria-current=true]{width:26px;background:var(--red)}

/* 7. fly to cart */
.fly{position:fixed;z-index:70;border-radius:10px;object-fit:cover;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .7s cubic-bezier(.55,-.25,.75,.9),opacity .7s ease-in}

/* 8. low stock pulse */
.stock.low{color:var(--red);display:flex;align-items:center;gap:8px}
.stock.low::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);animation:lowP 1.4s infinite}
@keyframes lowP{0%{box-shadow:0 0 0 0 rgba(225,29,46,.55)}70%{box-shadow:0 0 0 9px rgba(225,29,46,0)}100%{box-shadow:0 0 0 0 rgba(225,29,46,0)}}
.card .low{font-size:12.5px;font-weight:700;color:var(--red)}

/* 9. sticky buy bar */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.1);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.sbar.on{transform:none}
.sbar img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}
.sbar .t{flex:1;min-width:0}.sbar .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .btn{min-height:46px;padding:10px 18px}
body.sbar-on .wa{bottom:calc(84px + env(safe-area-inset-bottom))}
body.sbar-on .ping{bottom:calc(84px + env(safe-area-inset-bottom))}
.wa,.ping{transition:bottom .3s}

/* 10. free delivery bar */
.fbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0 12px}
.fbar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:width .6s cubic-bezier(.2,.7,.2,1),background .3s}
.fbar.full i{background:var(--ok)}
.fmsg{font-size:14px;font-weight:600}
.fmsg.full{color:var(--ok)}

/* 11. confetti */
.cf{position:fixed;top:-12px;z-index:80;width:8px;height:14px;pointer-events:none;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate3d(var(--x),105vh,0) rotate(var(--r))}}
.done .ok{animation:okPop .5s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes okPop{from{transform:scale(0)}}

/* 12. cards fade in on scroll */
.card.fx{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
.card.fx.in{opacity:1;transform:none}

/* 13. photo swap on hover (laptop only) */
.card .ph .alt{position:absolute;inset:0;opacity:0;transition:opacity .35s}
@media(hover:hover){.card:hover .ph .alt{opacity:1}}

/* 14. image zoom */
.gal .main.zm{cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.zoom.on{opacity:1;pointer-events:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .3s;cursor:zoom-in;transform:scale(.92)}
.zoom.on img{transform:none}
.zoom img.z{transform:scale(2.2);cursor:zoom-out}
.zoom .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;color:#fff;font-size:36px;z-index:1}
.zoom .hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#aaa;font-size:13px}

/* 15. announcement ticker */
.announce.tick{overflow:hidden;white-space:nowrap;text-align:left;padding:7px 0}
.announce .trk{display:inline-flex;animation:tick var(--dur,20s) linear infinite}
.announce .trk span{padding-right:56px}
@keyframes tick{to{transform:translateX(-50%)}}

/* 16. tracking timeline fill */
.timeline div{z-index:1}
.tl-bg,.tl-fill{position:absolute;top:7px;height:3px;left:12.5%;border-radius:2px}
.tl-bg{right:12.5%;background:var(--line)}
.tl-fill{background:var(--red);width:var(--w);animation:tlw var(--t) cubic-bezier(.4,0,.2,1) both}
@keyframes tlw{from{width:0}}
.timeline div.on::before{animation:dotOn .35s var(--d,0s) both}
@keyframes dotOn{from{background:var(--line);transform:scale(.6)}}

.timeline.na .tl-fill,.timeline.na div.on::before{animation:none}
.paused{background:#14161a;color:#fff;text-align:center;font-weight:600;font-size:14px;padding:9px 16px}
.paused[hidden]{display:none}
/* 17. whatsapp wiggle */
.wa.wig{animation:wig .9s}
@keyframes wig{0%,100%{transform:none}15%{transform:rotate(-14deg) scale(1.08)}30%{transform:rotate(12deg) scale(1.08)}45%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const SB="https://hmxfiyzinxihanckmuil.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhteGZpeXppbnhpaGFuY2ttdWlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMzE3MTAsImV4cCI6MjEwODYwNzcxMH0.qBkAZbqFFUU6mRsii6ff15Vd8FM4r-CApDgRQdjNdIg";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const $=s=>document.querySelector(s);
const app=$("#app");
const rs=n=>"Rs "+Number(n||0).toLocaleString("en-PK");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let products=ls.get("rsi_products",[]), store=ls.get("rsi_store",{}), payments=ls.get("rsi_pay",{}), feat=ls.get("rsi_feat",{});
/* feature switches from RSI OS → Settings. Missing = ON. */
const on=k=>feat[k]!==false;
const A=k=>!RM&&on("anim")&&on(k);
const payOn=()=>Object.keys(PAYN).filter(k=>on("pay_"+k));
const taking=()=>on("orders")&&payOn().length>0;
let cart=ls.get("rsi_cart",[]), cat="All", loaded=products.length>0;

async function api(path,opt={}){
  const r=await fetch(SB+path,{...opt,headers:H});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||"Something went wrong. Please try again.");
  return j;
}
async function load(){
  try{
    const [p,s]=await Promise.all([
      api("/rest/v1/products?select=id,slug,name,category,price,compare_price,stock,images,short,description,features,badge&active=eq.true&order=sort.asc"),
      api("/rest/v1/settings?select=key,value")
    ]);
    const changed=!loaded||JSON.stringify([p,s])!==JSON.stringify(ls.get("rsi_raw",null));ls.set("rsi_raw",[p,s]);
    products=p;ls.set("rsi_products",p);
    feat={};for(const x of s){if(x.key==="store")store=x.value;if(x.key==="payments")payments=x.value;if(x.key==="features")feat=x.value||{}}
    ls.set("rsi_store",store);ls.set("rsi_pay",payments);ls.set("rsi_feat",feat);
    loaded=true;cart=cart.filter(c=>products.some(p=>p.id===c.id));saveCart(false);
    applyStore();if(changed)route();
    loadReviews();loadSales();
  }catch(e){if(!loaded){app.innerHTML=`<div class="wrap sec"><div class="empty">Couldn't load products. Check your internet and refresh.</div></div>`}}
}
function waLink(text){const n=(store.whatsapp||"").replace(/\D/g,"").replace(/^0/,"92");return n?`https://wa.me/${n}${text?"?text="+encodeURIComponent(text):""}`:""}
function applyStore(){
  ticker();
  const w=waLink("Hi RSI Accessories, I have a question.");
  $("#waFloat").classList.toggle("on",!!w&&on("whatsapp"));
  for(const id of ["navTrack","fTrack"])$("#"+id).style.display=on("track")?"":"none";
  $("#paused").hidden=taking();$("#waFloat").href=w||"#";$("#fWa").href=w||"#/policy";
}
const P=id=>products.find(p=>p.id===id);
const img=(p,i=0)=>(p.images&&p.images[i])||"img/logo.webp";

/* cart */
function saveCart(render=true){ls.set("rsi_cart",cart);$("#cartCount").textContent=cart.reduce((a,c)=>a+c.qty,0);if(render)renderCart()}
function add(id,q=1,open=true,btn){
  const p=P(id);if(!p)return;
  if(p.stock<=0){toast("Sorry, this is out of stock");return}
  const c=cart.find(c=>c.id===id);
  if(c)c.qty=Math.min(10,c.qty+q);else cart.push({id,qty:Math.min(10,q)});
  saveCart();okFlash(btn);
  const src=btn&&(btn.closest(".card")?.querySelector(".ph img")||(btn.id==="addc"?$("#mainImg"):null));
  if(open===true||!flyToCart(src))bumpCart();
  if(open===true)openCart();else if(open!=="silent")toast("Added to cart");
}
function setQty(id,q){const c=cart.find(c=>c.id===id);if(!c)return;c.qty=Math.max(0,Math.min(10,q));cart=cart.filter(c=>c.qty>0);saveCart()}
function totals(){
  const sub=cart.reduce((a,c)=>{const p=P(c.id);return a+(p?p.price*c.qty:0)},0);
  const free=Number(store.delivery_fee||0)>0?Number(store.free_delivery_over||0):0; // no "free delivery" goal when delivery is already free
  const fee=sub===0?0:(free&&sub>=free?0:Number(store.delivery_fee||0));
  return{sub,fee,total:sub+fee,free};
}
let lastPct=0;
function renderCart(){
  const b=$("#cartBody"),f=$("#cartFoot");
  if(!cart.length){b.innerHTML=`<div style="padding:40px 0;text-align:center" class="muted">Your cart is empty.</div>`;f.innerHTML=`<button class="btn full" onclick="closeCart();location.hash='#/'">Continue shopping</button>`;return}
  b.innerHTML=cart.map(c=>{const p=P(c.id);if(!p)return"";return`<div class="line">
    <img src="${esc(img(p))}" alt="" width="64" height="64" loading="lazy">
    <div><div class="nm">${esc(p.name)}</div><div class="mini">
      <button aria-label="Less" onclick="setQty('${p.id}',${c.qty-1})">−</button><b>${c.qty}</b>
      <button aria-label="More" onclick="setQty('${p.id}',${c.qty+1})">+</button>
      <button class="rm" onclick="setQty('${p.id}',0)">Remove</button></div></div>
    <div class="price" style="font-size:15px">${rs(p.price*c.qty)}</div></div>`}).join("");
  const t=totals();
  const pct=t.free?Math.min(100,Math.round(t.sub/t.free*100)):0,full=pct>=100;
  const left=!t.free?"":!on("freebar")?(t.sub<t.free?`<div class="muted" style="margin-bottom:8px">Add ${rs(t.free-t.sub)} more for free delivery</div>`:""):`<div class="fmsg${full?" full":""}">${full?"🎉 You got FREE delivery!":`Add ${rs(t.free-t.sub)} more for FREE delivery`}</div>
   <div class="fbar${full?" full":""}"><i id="fbi" style="width:${lastPct}%"></i></div>`;
  f.innerHTML=`${left}<div class="row"><span>Subtotal</span><b>${rs(t.sub)}</b></div>
   <div class="row muted"><span>Delivery</span><span>${t.fee?rs(t.fee):"Free"}</span></div>
   <div class="row big"><span>Total</span><span>${rs(t.total)}</span></div>
   <button class="btn red full" style="margin-top:12px" onclick="closeCart();location.hash='#/checkout'">Checkout</button>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#fbi");if(b)b.style.width=pct+"%";lastPct=pct}));
}
function openCart(){renderCart();$("#drawer").classList.add("on");$("#scrim").classList.add("on");$("#drawer").setAttribute("aria-hidden","false");$("#closeCart").focus()}
function closeCart(){$("#drawer").classList.remove("on");$("#scrim").classList.remove("on");$("#drawer").setAttribute("aria-hidden","true")}
$("#cartBtn").onclick=openCart;$("#closeCart").onclick=closeCart;$("#scrim").onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}

/* ===== animations ===== */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let timers=[];const every=(f,ms)=>timers.push(setInterval(f,ms));
function clearTimers(){timers.forEach(clearInterval);timers=[]}
let heroPlayed=false;

/* word rotator */
const WORDS=["gifting","the gym","travel","everyday use"];
function rotator(){const el=$("#rot");if(!el||!A("rotator"))return;let i=0;
  every(()=>{i=(i+1)%WORDS.length;el.classList.remove("sw");void el.offsetWidth;el.textContent=WORDS[i];el.classList.add("sw")},2400)}

/* price roll: old price rolls down to new price */
function roll(el,from,to,delay=0,ms=900){
  if(!el)return;
  if(!A("priceroll")||!from||from<=to){el.textContent=rs(to);return}
  el.textContent=rs(from);
  setTimeout(()=>{const t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);
      el.textContent=rs(Math.round(from+(to-from)*e));if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step)},delay);
}

/* click success */
function okFlash(btn,label="✓ Added"){
  if(!btn||!on("clickok")||!on("anim"))return;btn.dataset.l=btn.dataset.l||btn.textContent;
  btn.classList.remove("ok");void btn.offsetWidth;btn.classList.add("ok");btn.textContent=label;
  clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.classList.remove("ok");btn.textContent=btn.dataset.l},1400);
}
function bumpCart(){if(!on("clickok")||!on("anim"))return;const n=$("#cartCount");n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump")}

/* sale pings: real orders only (city + product, no names) */
let sales=[],pingN=0;
async function loadSales(){
  if(!on("pings"))return;
  try{sales=await api("/rest/v1/rpc/recent_sales",{method:"POST",body:"{}"})||[]}catch{sales=[]}
  if(sales.length)setTimeout(nextPing,8000);
}
function ago(t){const m=Math.round((Date.now()-new Date(t))/60000);
  if(m<2)return"just now";if(m<60)return m+" minutes ago";
  const h=Math.round(m/60);if(h<24)return h+(h>1?" hours ago":" hour ago");
  const d=Math.round(h/24);return d+(d>1?" days ago":" day ago")}
function nextPing(){
  if(!on("pings")||pingN>=Math.min(6,sales.length))return;
  const h=location.hash,el=$("#ping");
  if(h.startsWith("#/checkout")||h.startsWith("#/done")||$("#drawer").classList.contains("on")){setTimeout(nextPing,15000);return}
  const s=sales[pingN++],p=products.find(x=>x.name===s.product);
  el.href=p?"#/p/"+encodeURIComponent(p.slug):"#/";
  el.innerHTML=`<img src="${esc(s.image||(p?img(p):"img/logo.webp"))}" alt="" width="44" height="44"><span><b>Someone in ${esc(s.city)}</b>ordered ${esc(s.product)}<br><small><span class="dot"></span>${ago(s.created_at)}</small></span>`;
  el.classList.add("on");setTimeout(()=>el.classList.remove("on"),5500);
  setTimeout(nextPing,22000);
}

/* review shuffle: approved reviews only */
let reviews=[];
async function loadReviews(){
  try{reviews=(await api("/rest/v1/reviews?select=name,city,rating,body,product_id&approved=eq.true&order=created_at.desc&limit=12"))||[]}catch{reviews=[]}
  reviews.sort(()=>Math.random()-.5);mountReviews();
}
function mountReviews(){
  const slot=$("#revSlot");if(!slot||!reviews.length||!on("reviews"))return;let i=0;
  slot.innerHTML=`<section class="revs"><div class="wrap"><h2>What customers say</h2><div class="rcard" id="rc" aria-live="polite"></div>
    ${reviews.length>1?`<div class="rdots">${reviews.map((_,k)=>`<button aria-label="Review ${k+1}" data-k="${k}"></button>`).join("")}</div>`:""}</div></section>`;
  const show=(k,anim)=>{i=k;const r=reviews[k],p=r.product_id&&P(r.product_id),c=$("#rc");if(!c)return;
    c.classList.remove("sw");if(anim){void c.offsetWidth;c.classList.add("sw")}
    c.innerHTML=`<div class="stars" aria-label="${r.rating} out of 5 stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div>
      <p>“${esc(r.body)}”</p><b>${esc(r.name)}</b>${r.city?`<span class="muted"> · ${esc(r.city)}</span>`:""}${p?`<div class="muted">Bought: ${esc(p.name)}</div>`:""}`;
    slot.querySelectorAll(".rdots button").forEach(b=>b.setAttribute("aria-current",String(+b.dataset.k===k)))};
  show(0,false);
  slot.querySelectorAll(".rdots button").forEach(b=>b.onclick=()=>show(+b.dataset.k,true));
  if(reviews.length>1&&A("reviews"))every(()=>show((i+1)%reviews.length,true),5000);
}

/* fly to cart */
function flyToCart(src){
  if(!A("fly")||!src||!src.getBoundingClientRect)return false;
  const a=src.getBoundingClientRect(),b=$("#cartBtn").getBoundingClientRect();
  if(a.width<2||a.bottom<0||a.top>innerHeight)return false;
  const s=Math.min(a.width,a.height,140),f=document.createElement("img");
  f.src=src.currentSrc||src.src;f.className="fly";f.alt="";
  Object.assign(f.style,{left:(a.left+a.width/2-s/2)+"px",top:(a.top+a.height/2-s/2)+"px",width:s+"px",height:s+"px"});
  document.body.appendChild(f);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${dx}px,${dy}px) scale(${20/s})`;f.style.opacity=".4"}));
  setTimeout(()=>{f.remove();bumpCart()},720);
  return true;
}

/* cards fade in on scroll */
let cardIO;
function revealCards(){
  if(!A("cardsfx")||!("IntersectionObserver" in window))return;
  cardIO&&cardIO.disconnect();
  cardIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");cardIO.unobserve(e.target)}}),{rootMargin:"0px 0px -40px 0px"});
  app.querySelectorAll(".card").forEach((c,i)=>{c.classList.add("fx");c.style.transitionDelay=(i%4)*70+"ms";cardIO.observe(c)});
}

/* sticky buy bar */
let sbarIO;
function stickyBar(p){
  const bar=$("#sbar"),buy=$("#buy");if(!buy||p.stock<=0)return;
  bar.innerHTML=`<img src="${esc(img(p))}" alt="" width="46" height="46"><div class="t"><b>${esc(p.name)}</b><span class="price" style="font-size:15px">${rs(p.price)}</span></div><button class="btn red" id="sbBuy">Buy now</button>`;
  $("#sbBuy").onclick=()=>buy.click();
  sbarIO=new IntersectionObserver(([e])=>{const on=!e.isIntersecting&&e.boundingClientRect.top<0;
    bar.classList.toggle("on",on);bar.setAttribute("aria-hidden",String(!on));document.body.classList.toggle("sbar-on",on)});
  sbarIO.observe(buy);
}
function hideBar(){sbarIO&&sbarIO.disconnect();sbarIO=null;$("#sbar").classList.remove("on");document.body.classList.remove("sbar-on")}

/* confetti */
let justOrdered=false;
function confetti(){
  if(!A("confetti"))return;const cols=["#e11d2e","#14161a","#0f8a4b","#f5a400","#ffffff"];
  for(let i=0;i<60;i++){const c=document.createElement("i");c.className="cf";
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};--x:${(Math.random()-.5)*160}px;--r:${(Math.random()*900-450)|0}deg;animation-duration:${1.8+Math.random()*1.6}s;animation-delay:${Math.random()*.4}s;${i%3?"":"border-radius:50%;height:8px"}`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200)}
}

/* image zoom */
function openZoom(src){const z=$("#zoom"),im=$("#zoomImg");im.src=src;im.classList.remove("z");z.classList.add("on");z.setAttribute("aria-hidden","false");$("#zoomX").focus()}
function closeZoom(){const z=$("#zoom");z.classList.remove("on");z.setAttribute("aria-hidden","true")}
$("#zoomX").onclick=closeZoom;
$("#zoom").onclick=e=>{if(e.target.id==="zoom")closeZoom()};
$("#zoomImg").onclick=e=>{const im=e.currentTarget,r=im.getBoundingClientRect();
  im.style.transformOrigin=`${((e.clientX-r.left)/r.width*100).toFixed(1)}% ${((e.clientY-r.top)/r.height*100).toFixed(1)}%`;im.classList.toggle("z")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeZoom()});

/* announcement ticker */
function ticker(){
  const el=$("#announce"),txt=on("announce")?store.announcement||"":"";el.classList.remove("tick");el.textContent=txt;
  if(!txt||!A("ticker"))return;
  el.style.whiteSpace="nowrap";
  requestAnimationFrame(()=>{const fits=el.scrollWidth<=el.clientWidth+2;el.style.whiteSpace="";if(fits)return;
    el.classList.add("tick");el.innerHTML=`<div class="trk" style="--dur:${Math.max(12,txt.length*.28)}s"><span>${esc(txt)}</span><span aria-hidden="true">${esc(txt)}</span></div>`});
}
let lastW=innerWidth;addEventListener("resize",()=>{if(innerWidth===lastW)return;lastW=innerWidth;clearTimeout(ticker._t);ticker._t=setTimeout(ticker,300)});

/* whatsapp wiggle: once after 10 seconds */
setTimeout(()=>{const w=$("#waFloat");if(A("wawiggle")&&w.classList.contains("on"))w.classList.add("wig")},10000);

/* views */
const HOVER=matchMedia("(hover:hover)").matches;
function card(p){
  const out=p.stock<=0;
  return`<a class="card" href="#/p/${esc(p.slug)}">
   <div class="ph"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy" width="400" height="400">${HOVER&&A("hoverswap")&&p.images&&p.images[1]?`<img class="alt" src="${esc(p.images[1])}" alt="" loading="lazy" width="400" height="400">`:""}
   ${out?`<span class="badge out">Sold out</span>`:p.badge?`<span class="badge">${esc(p.badge)}</span>`:""}</div>
   <div class="bd"><h3>${esc(p.name)}</h3>
   <div class="price">${rs(p.price)}${p.compare_price>p.price?`<s>${rs(p.compare_price)}</s>`:""}</div>
   ${!out&&on("lowstock")&&p.stock<=5?`<div class="low">Only ${p.stock} left</div>`:""}
   <button class="add" ${out?"disabled":""} onclick="event.preventDefault();add('${p.id}',1,false,this)">${out?"Sold out":"Add to cart"}</button></div></a>`;
}
const trust=`<div class="trust">
 <div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg><span><b>Cash on Delivery</b><small>Pay when it reaches you</small></span></div>
 <div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 6h13v10H1zM14 10h5l3 3v3h-8z"/><circle cx="5.5" cy="17.5" r="1.8"/><circle cx="18" cy="17.5" r="1.8"/></svg><span><b>All over Pakistan</b><small>Delivered to your door</small></span></div>
 <div><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-4-7.5L21 3v5h-5"/></svg><span><b>Easy online payment</b><small>JazzCash, Easypaisa or bank</small></span></div>
</div>`;
function home(){
  document.title="RSI Accessories — Massagers, Trimmers & Trending Gadgets in Pakistan";
  if(!loaded){app.innerHTML=`<div class="wrap sec"><div class="grid">${'<div class="skel"></div>'.repeat(4)}</div></div>`;return}
  const f=products[0];
  if(!on("chips"))cat="All";
  const cats=["All",...new Set(products.map(p=>p.category))];
  const list=products.filter(p=>cat==="All"||p.category===cat);
  clearTimers();
  const play=!heroPlayed&&A("hero");heroPlayed=true;
  const was=f&&f.compare_price>f.price?f.compare_price:0;
  app.innerHTML=`${f?`<section class="hero${play?" play":""}"><div class="wrap hero-in">
    <a class="hero-img" href="#/p/${esc(f.slug)}"><img src="${esc(img(f))}" alt="${esc(f.name)}" width="1000" height="750" fetchpriority="high">${f.badge?`<span class="badge">${esc(f.badge)}</span>`:""}</a>
    <div class="hero-txt"><span class="tag rv">Perfect for <span class="rot" id="rot">${WORDS[0]}</span></span>
      <h1 class="pname rv">${esc(f.name)}</h1><p class="rv">${esc(f.short||"")}</p>
      <div class="stripe rv"><span class="roll" id="heroPrice">${rs(play&&was?was:f.price)}</span>${was?`<s>${rs(was)}</s>`:""}</div>
      <div class="btns rv"><button class="btn red" onclick="add('${f.id}');">Buy now</button><a class="btn ghost" href="#/p/${esc(f.slug)}">See details</a></div>
    </div></div></section>`:""}
    ${on("trust")?trust:""}
    <section class="sec"><div class="wrap">
      <h2>Shop all</h2><p class="sub">${products.length} products • Cash on Delivery available</p>
      ${on("chips")&&cats.length>2?`<div class="chips" role="group" aria-label="Categories">${cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" onclick="cat='${esc(c)}';home()">${esc(c)}</button>`).join("")}</div>`:""}
      ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">No products here yet.</div>`}
    </div></section><div id="revSlot"></div>`;
  if(f&&play)roll($("#heroPrice"),was,f.price,700);
  rotator();mountReviews();revealCards();
}
function product(slug){
  const p=products.find(p=>p.slug===slug);
  if(!p){app.innerHTML=loaded?`<div class="wrap sec"><div class="empty">This product isn't available. <a href="#/">See all products</a></div></div>`:"";return}
  document.title=p.name+" — RSI Accessories";
  let q=1;const imgs=p.images&&p.images.length?p.images:["img/logo.webp"];const out=p.stock<=0;
  app.innerHTML=`<div class="wrap"><p class="crumb"><a href="#/">Shop</a> / ${esc(p.category)}</p>
   <div class="pp"><div class="gal"><div class="main"><img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.name)}" width="800" height="800"></div>
   ${imgs.length>1?`<div class="thumbs">${imgs.map((u,i)=>`<button aria-label="Photo ${i+1}" aria-pressed="${i===0}" data-u="${esc(u)}"><img src="${esc(u)}" alt="" loading="lazy" width="72" height="72"></button>`).join("")}</div>`:""}</div>
   <div class="pinfo"><h1 class="pname">${esc(p.name)}</h1>
    <div class="price"><span class="roll" id="ppPrice">${rs(p.price)}</span>${p.compare_price>p.price?`<s>${rs(p.compare_price)}</s>`:""}</div>
    <div class="stock ${out?"no":on("lowstock")&&p.stock<=5?"low":"ok"}">${out?"Sold out — WhatsApp us to pre-order":on("lowstock")&&p.stock<=5?`Only ${p.stock} left in stock`:"In stock, ready to ship"}</div>
    ${out?"":`<div class="qty"><button aria-label="Less" id="qm">−</button><output id="qv">1</output><button aria-label="More" id="qp">+</button></div>`}
    <div class="btns"><button class="btn red full" id="buy" ${out?"disabled":""}>Buy now — Cash on Delivery</button>
     <button class="btn ghost full" id="addc" ${out?"disabled":""}>Add to cart</button></div>
    ${p.features&&p.features.length?`<ul class="feat">${p.features.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${p.description?`<p class="desc">${esc(p.description)}</p>`:""}
   </div></div></div>`;
  app.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{$("#mainImg").src=b.dataset.u;app.querySelectorAll(".thumbs button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  if(!out){
    $("#qm").onclick=()=>{q=Math.max(1,q-1);$("#qv").textContent=q};
    $("#qp").onclick=()=>{q=Math.min(10,q+1);$("#qv").textContent=q};
    $("#buy").onclick=()=>{add(p.id,q,"silent");location.hash="#/checkout"};
    $("#addc").onclick=()=>add(p.id,q,false,$("#addc"));
  }
  if(p.compare_price>p.price)roll($("#ppPrice"),p.compare_price,p.price,250);
  if(on("zoom")){$(".gal .main").classList.add("zm");$(".gal .main").onclick=()=>openZoom($("#mainImg").src)}
  if(on("sticky"))stickyBar(p);
  window.scrollTo(0,0);
}
const PAYN={cod:"Cash on Delivery",jazzcash:"JazzCash",easypaisa:"Easypaisa",bank:"Bank transfer"};
function payInfo(m){
  if(m==="cod")return"Pay cash to the rider when your parcel arrives.";
  const a=m==="bank"?payments.bank:payments[m];
  const has=a&&(a.number||a.iban);
  const det=has?(m==="bank"?`<b>${esc(a.bank)}</b><br>Account title: ${esc(a.title)}<br>IBAN / Account: <b>${esc(a.iban)}</b>`:`Account title: ${esc(a.title)}<br>Number: <b>${esc(a.number)}</b>`):"We'll send you the account details on WhatsApp after you place the order.";
  return `${det}<br><span class="muted">Send ${rs(totals().total)}, then enter the transaction ID below (you can also send it later on WhatsApp).</span>
   <label for="pref">Transaction ID (optional)</label><input id="pref" maxlength="60" autocomplete="off">`;
}
function checkout(){
  document.title="Checkout — RSI Accessories";
  if(!loaded){app.innerHTML="";return}
  if(!cart.length){app.innerHTML=`<div class="wrap sec"><div class="empty">Your cart is empty. <a href="#/">Shop products</a></div></div>`;return}
  if(!taking()){app.innerHTML=`<div class="wrap sec"><div class="empty">Sorry, we're not taking new orders right now.${waLink()?` <a href="${waLink("Hi RSI Accessories, I want to order.")}" target="_blank" rel="noopener">Message us on WhatsApp</a>`:""}</div></div>`;return}
  const t=totals();const saved=ls.get("rsi_cust",{});const pays=payOn();
  app.innerHTML=`<div class="wrap co">
   <form class="box" id="cof" novalidate><h2>Delivery details</h2>
    <label for="nm">Full name</label><input id="nm" autocomplete="name" required value="${esc(saved.name)}">
    <label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="03XX XXXXXXX" required value="${esc(saved.phone)}">
    <div class="two"><div><label for="ct">City</label><input id="ct" autocomplete="address-level2" required value="${esc(saved.city)}"></div>
     <div><label for="em">Email (optional)</label><input id="em" type="email" autocomplete="email" value="${esc(saved.email)}"></div></div>
    <label for="ad">Full address</label><textarea id="ad" rows="2" autocomplete="street-address" placeholder="House no, street, area, landmark" required>${esc(saved.address)}</textarea>
    <label for="nt">Note (optional)</label><input id="nt" maxlength="300">
    <h3>Payment</h3>
    <div class="pay" role="radiogroup">${pays.map((k,i)=>`<label><input type="radio" name="pm" value="${k}" ${i===0?"checked":""}> ${PAYN[k]}</label>`).join("")}</div>
    <div class="payinfo" id="pinfo">${payInfo(pays[0])}</div>
    <div class="err" id="err" role="alert"></div>
    <button class="btn red full" style="margin-top:16px" id="place">Place order — ${rs(t.total)}</button>
   </form>
   <div class="box sum"><h2>Your order</h2>
    ${cart.map(c=>{const p=P(c.id);return p?`<div class="line" style="grid-template-columns:56px 1fr auto"><img src="${esc(img(p))}" alt="" width="56" height="56" style="width:56px;height:56px"><div class="nm">${esc(p.name)}<div class="muted">Qty ${c.qty}</div></div><b>${rs(p.price*c.qty)}</b></div>`:""}).join("")}
    <div style="margin-top:12px"><div class="row"><span>Subtotal</span><span>${rs(t.sub)}</span></div>
    <div class="row"><span>Delivery</span><span>${t.fee?rs(t.fee):"Free"}</span></div>
    <div class="row big"><span>Total</span><span>${rs(t.total)}</span></div></div>
   </div></div>`;
  app.querySelectorAll('input[name=pm]').forEach(r=>r.onchange=()=>{$("#pinfo").innerHTML=payInfo(r.value)});
  $("#cof").onsubmit=async e=>{
    e.preventDefault();const err=$("#err");err.textContent="";
    const v=id=>($("#"+id)?.value||"").trim();
    const d={name:v("nm"),phone:v("ph"),city:v("ct"),email:v("em"),address:v("ad")};
    if(d.name.length<2)return err.textContent="Please enter your name.";
    if(d.phone.replace(/\D/g,"").length<10)return err.textContent="Please enter a valid phone number, like 0300 1234567.";
    if(d.city.length<2)return err.textContent="Please enter your city.";
    if(d.address.length<8)return err.textContent="Please enter your full address so the rider can find you.";
    const pm=app.querySelector('input[name=pm]:checked').value;
    const btn=$("#place");btn.disabled=true;btn.textContent="Placing order…";
    try{
      const r=await api("/rest/v1/rpc/place_order",{method:"POST",body:JSON.stringify({p_name:d.name,p_phone:d.phone,p_city:d.city,p_address:d.address,p_email:d.email,p_note:v("nt"),p_payment:pm,p_payment_ref:v("pref"),p_items:cart.map(c=>({id:c.id,qty:c.qty}))})});
      ls.set("rsi_cust",d);
      const items=cart.map(c=>{const p=P(c.id);return`${c.qty} x ${p?p.name:""}`}).join(", ");
      ls.set("rsi_last",{no:r.order_no,total:r.total,pm,items,phone:d.phone});
      cart=[];saveCart(false);justOrdered=true;location.hash="#/done/"+r.order_no;
    }catch(ex){err.textContent=ex.message;btn.disabled=false;btn.textContent=`Place order — ${rs(totals().total)}`}
  };
}
function done(no){
  const l=ls.get("rsi_last",{});
  const w=waLink(`Hi RSI Accessories, I placed order RSI-${no} (${l.items||""}) — total ${rs(l.total)}. Please confirm.`);
  app.innerHTML=`<div class="wrap"><div class="done box">
   <div class="ok"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5L20 7"/></svg></div>
   <h1>Order placed</h1><div class="ordno">RSI-${esc(no)}</div>
   <p>Thank you! We'll call or WhatsApp you to confirm your order.${l.pm&&l.pm!=="cod"?" Please send your payment and share the transaction ID with us.":""}</p>
   <div class="btns" style="justify-content:center;margin-top:18px">
    ${w?`<a class="btn red" href="${w}" target="_blank" rel="noopener">Confirm on WhatsApp</a>`:""}
    ${on("track")?`<a class="btn ghost" href="#/track">Track this order</a>`:""}</div></div></div>`;
  if(justOrdered){justOrdered=false;confetti()}
  window.scrollTo(0,0);
}
const STEPS=["pending","confirmed","shipped","delivered"];
const STN={pending:"Received",confirmed:"Confirmed",packed:"Packed",shipped:"On the way",delivered:"Delivered",cancelled:"Cancelled",returned:"Returned"};
function track(){
  document.title="Track order — RSI Accessories";
  const l=ls.get("rsi_last",{});
  app.innerHTML=`<div class="wrap"><div class="done box" style="text-align:left">
   <h1 style="text-align:center">Track your order</h1>
   <form id="tf"><div class="two"><div><label for="tno">Order number</label><input id="tno" inputmode="numeric" placeholder="e.g. 1001" value="${esc(l.no||"")}"></div>
   <div><label for="tph">Phone number</label><input id="tph" type="tel" value="${esc(l.phone||"")}"></div></div>
   <div class="err" id="terr"></div><button class="btn full" style="margin-top:14px">Track order</button></form>
   <div id="tres"></div></div></div>`;
  $("#tf").onsubmit=async e=>{
    e.preventDefault();$("#terr").textContent="";$("#tres").innerHTML="";
    const no=parseInt($("#tno").value.replace(/\D/g,""));
    if(!no)return $("#terr").textContent="Enter your order number (the digits after RSI-).";
    try{
      const r=await api("/rest/v1/rpc/track_order",{method:"POST",body:JSON.stringify({p_order_no:no,p_phone:$("#tph").value})});
      if(!r)return $("#terr").textContent="No order found with that number and phone. Check both and try again.";
      const st=r.status==="packed"?"confirmed":r.status;const idx=STEPS.indexOf(st);
      $("#tres").innerHTML=`<h3 style="margin-top:22px">Order RSI-${r.order_no} — ${STN[r.status]}</h3>
       ${idx>=0?`<div class="timeline${A("trackfill")?"":" na"}"><span class="tl-bg"></span><span class="tl-fill" style="--w:${idx/3*75}%;--t:${idx*.35}s"></span>${STEPS.map((s,i)=>`<div class="${i<=idx?"on":""}" style="--d:${i*.35}s">${STN[s]}</div>`).join("")}</div>`:""}
       ${r.tracking_no?`<p>Courier: <b>${esc(r.courier||"")}</b> — Tracking no: <b>${esc(r.tracking_no)}</b></p>`:""}
       <p class="muted">${(r.items||[]).map(i=>`${i.qty} × ${esc(i.name)}`).join("<br>")}<br>Total ${rs(r.total)} • Payment ${r.payment_status}</p>`;
    }catch(ex){$("#terr").textContent=ex.message}
  };
}
function policy(){
  app.innerHTML=`<div class="wrap"><div class="done box" style="text-align:left"><h1>Delivery & returns</h1>
  <p><b>Delivery:</b> We deliver all over Pakistan. ${store.delivery_fee?`Delivery charge is ${rs(store.delivery_fee)}`:"Delivery is free"}${store.delivery_fee&&store.free_delivery_over?`, and free on orders over ${rs(store.free_delivery_over)}`:""}.</p>
  <p><b>Payment:</b> Cash on Delivery, JazzCash, Easypaisa or bank transfer.</p>
  <p><b>Problems with your order?</b> Message us on WhatsApp with your order number and we'll sort it out.</p></div></div>`;
}
function route(){
  clearTimers();hideBar();closeZoom();
  const h=location.hash.slice(1)||"/";const [,a,b]=h.split("/");
  if(a==="p")product(decodeURIComponent(b||""));
  else if(a==="checkout")checkout();
  else if(a==="done")done(b);
  else if(a==="track"&&on("track"))track();
  else if(a==="policy")policy();
  else if(a==="cart"){home();openCart()}
  else home();
}
addEventListener("hashchange",()=>{route();if(!location.hash.startsWith("#/p/"))window.scrollTo(0,0)});
$("#yr").textContent=new Date().getFullYear();
applyStore();saveCart(false);route();load();
</script>
</body>
</html>
